services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alojamientos
      POSTGRES_USER: alojamientos
      POSTGRES_PASSWORD: alojamientos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alojamientos -d alojamientos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-cambiar}
      DEBUG: ${DEBUG:-1}
      POSTGRES_DB: alojamientos
      POSTGRES_USER: alojamientos
      POSTGRES_PASSWORD: alojamientos
      POSTGRES_HOST: db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
