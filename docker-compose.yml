services:
  backend:
    build: .
    container_name: alojamientos_backend
    environment:
      SECRET_KEY: dev-insecure-key-cambiar
      DEBUG: 1
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8001
      # Omitimos POSTGRES_* para que Django use SQLite automáticamente
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"